<!DOCTYPE html>
<html>
<button onclick="reindex()">🔄 Re-index</button>

<head>
<meta charset="UTF-8">

<title>Data Center</title>

<style>

body{
font-family: Arial;
margin:40px;
}

h1{
margin-bottom:20px;
}

#files{
margin-top:20px;
}

.item{
padding:6px;
cursor:pointer;
}

.item:hover{
background:#eeeeee;
}

.folder{
font-weight:bold;
}

.back{
color:blue;
cursor:pointer;
margin-bottom:10px;
}

</style>

</head>

<body>

<h1>Data Center</h1>

<input id="search" placeholder="Search school or file..." style="width:300px;padding:8px;margin-bottom:20px;">

<div id="path"></div>

<div id="back"></div>

<div id="files"></div>

<script>

let currentPath = "";

async function loadFiles(path = "") {

    currentPath = path;

    let url = "/api/list";
    if (path !== "") {
        url += "?path=" + encodeURIComponent(path);
    }

    let res = await fetch(url);
    let data = await res.json();

    let filesDiv = document.getElementById("files");
    let backDiv = document.getElementById("back");

    filesDiv.innerHTML = "";
    backDiv.innerHTML = "";

    // back button
    if (path !== "") {
        let back = document.createElement("div");
        back.innerText = "⬅ Back";
        back.onclick = () => {
            let parts = path.split("/");
            parts.pop();
            loadFiles(parts.join("/"));
        };
        backDiv.appendChild(back);
    }

    data.forEach(item => {

        let div = document.createElement("div");

        div.innerHTML = `
            <div>${item.is_dir ? "📁" : "📄"} ${item.name}</div>
            <div style="font-size:12px;color:gray;">${item.path}</div>
        `;

div.onclick = () => {
    if (item.is_dir) {
        loadFiles(item.path);
    } else {

        let ext = item.name.split(".").pop().toLowerCase();

        if (["jpg","jpeg","png","gif","webp"].includes(ext)) {
            showImage(item.path);   // 👈 เพิ่มตรงนี้
        } else {
            window.open("/files/" + item.path);
        }

    }
};

        filesDiv.appendChild(div);
    });
}

// 🔥 SEARCH (ตัวสำคัญ)
let searchTimeout;

document.getElementById("search").addEventListener("input", function(){

    clearTimeout(searchTimeout);

    let q = this.value;

    if(q.length === 0){
        loadFiles(currentPath);
        return;
    }

    searchTimeout = setTimeout(async ()=>{

        let res = await fetch("/api/search?q=" + encodeURIComponent(q));
        let data = await res.json();

        showResults(data);

    }, 300); // delay 300ms

});

   function showResults(data){

    let filesDiv=document.getElementById("files");
    let backDiv=document.getElementById("back");

    filesDiv.innerHTML="";
    backDiv.innerHTML="";

    data.forEach(item=>{

        let div=document.createElement("div");
        div.className="item";

        if(item.is_dir){
            div.innerText="📁 "+item.name;
            div.onclick=()=>loadFiles(item.path);
        }else{
            div.innerText="📄 "+item.name;
            div.onclick=()=>window.open("/files/"+item.path);
        }
div.onclick=()=>{

    let ext = item.name.split(".").pop().toLowerCase();

    if (["jpg","jpeg","png","gif","webp"].includes(ext)) {
        showImage(item.path);   // 👈 เพิ่มตรงนี้
    } else {
        window.open("/files/"+item.path);
    }

};
        filesDiv.appendChild(div);

    });

}

async function reindex(){
    alert("กำลัง scan ไฟล์...");

    let res = await fetch("/api/reindex");
    let text = await res.text();

    alert(text);

    loadFiles(currentPath); // reload หน้า
}

function showImage(path){

    let preview=document.getElementById("preview");
    let img=document.getElementById("previewImg");

    img.src="/files/"+encodeURIComponent(path);

    preview.style.display="block";
}

function closePreview(){
    document.getElementById("preview").style.display="none";
}

// โหลดครั้งแรก

loadFiles();

</script>

<div id="preview" style="
    position:fixed;
    top:0;
    right:0;
    width:50%;
    height:100%;
    background:#111;
    display:none;
">
    <span onclick="closePreview()" style="color:white;cursor:pointer;">❌ Close</span>

    <img id="previewImg" style="max-width:100%;max-height:90%;">
</div>

</body>

</html>
