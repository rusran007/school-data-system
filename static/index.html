<!DOCTYPE html>
<html>


<head>
<meta charset="UTF-8">

<title>Data Center</title>

<style>

body{
font-family: Arial;
margin:40px;
}

h1{
margin-bottom:20px;
}

#files{
margin-top:20px;
}

.item{
padding:6px;
cursor:pointer;
user-select: none;
}

.item:hover{
background:#eeeeee;
}

.folder{
font-weight:bold;
}

.back{
color:blue;
cursor:pointer;
margin-bottom:10px;
}

</style>

</head>

<body>
<button onclick="reindex()">🔄 Re-index</button>

<h1>Data Center</h1>

<input id="search" placeholder="Search school or file..." style="width:300px;padding:8px;margin-bottom:20px;">

<div id="path"></div>

<div id="back"></div>

<div id="files"></div>

<script>
    
function getIcon(name, is_dir) {
    if (is_dir) return "📁";
    
    let ext = name.split(".").pop().toLowerCase();
    
    const icons = {
        jpg: "🖼️", jpeg: "🖼️", png: "🖼️", gif: "🖼️", webp: "🖼️",
        pdf: "📕",
        doc: "📘", docx: "📘",
        xls: "📗", xlsx: "📗",
        ppt: "📙", pptx: "📙",
        txt: "📝",
        mp4: "🎬", mov: "🎬", avi: "🎬",
        mp3: "🎵", wav: "🎵",
        zip: "🗜️", rar: "🗜️",
    };

    return icons[ext] || "📄";
}

let currentPath = "";

async function loadFiles(path = "") {

    currentPath = path;

    let url = "/api/list";
    if (path !== "") {
        url += "?path=" + encodeURIComponent(path);
    }

    let res = await fetch(url);
    let data = await res.json();

    let filesDiv = document.getElementById("files");
    let backDiv = document.getElementById("back");

    filesDiv.innerHTML = "";
    backDiv.innerHTML = "";

    if (path !== "") {
        let back = document.createElement("div");
        back.innerText = "⬅ Back";
        back.className = "back";
        back.onclick = () => {
            let parts = path.split("/");
            parts.pop();
            loadFiles(parts.join("/"));
        };
        backDiv.appendChild(back);
    }

    data.forEach(item => {
        let div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <div>${getIcon(item.name, item.is_dir)} ${item.name}</div>
            <div style="font-size:12px;color:gray;">${item.path}</div>
        `;

        div.onclick = () => {
            if (item.is_dir) {
                loadFiles(item.path);
            } else {
                let ext = item.name.split(".").pop().toLowerCase();
                if (["jpg","jpeg","png","gif","webp"].includes(ext)) {
                    showImage(item.path);
                } else {
                    window.open("/files/" + item.path);
                }
            }
        };

        filesDiv.appendChild(div);
    });
}

let searchTimeout;

document.getElementById("search").addEventListener("input", function(){

    clearTimeout(searchTimeout);

    let q = this.value;

    if (q.length === 0) {
        loadFiles(currentPath);
        return;
    }

    searchTimeout = setTimeout(async () => {
        let res = await fetch("/api/search?q=" + encodeURIComponent(q));
        let data = await res.json();
        showResults(data);
    }, 300);
});

function showResults(data) {

    let filesDiv = document.getElementById("files");
    let backDiv = document.getElementById("back");

    filesDiv.innerHTML = "";
    backDiv.innerHTML = "";

    data.forEach(item => {
        let div = document.createElement("div");
        div.className = "item";

        div.innerText = getIcon(item.name, item.is_dir) + " " + item.name;

        div.onclick = () => {
            if (item.is_dir) {
                loadFiles(item.path);
                return;
            }
            let ext = item.name.split(".").pop().toLowerCase();
            if (["jpg","jpeg","png","gif","webp"].includes(ext)) {
                showImage(item.path);
            } else {
                window.open("/files/" + item.path);
            }
        };

        filesDiv.appendChild(div);
    });
}

async function reindex() {
    alert("กำลัง scan ไฟล์...");
    let res = await fetch("/api/reindex");
    let text = await res.text();
    alert(text);
    loadFiles(currentPath);
}

function showImage(path) {
    let preview = document.getElementById("preview");
    let img = document.getElementById("previewImg");
    let downloadBtn = document.getElementById("downloadBtn");

    let url = "/files/" + path.split("/").map(encodeURIComponent).join("/");

    img.src = url;
    downloadBtn.href = url;
    preview.style.display = "block";
}

function closePreview() {
    document.getElementById("preview").style.display = "none";
}

loadFiles();

</script>

<div id="preview" style="
    position:fixed;
    top:0;
    right:0;
    width:50%;
    height:100%;
    background:#111;
    display:none;
    padding:10px;
">

    <div style="display:flex;justify-content:space-between;align-items:center;">
        <span onclick="closePreview()" style="color:white;cursor:pointer;">❌ Close</span>

        <a id="downloadBtn" style="color:white;" download>⬇ Download</a>
    </div>

    <img id="previewImg" style="max-width:100%;max-height:90%;margin-top:10px;">

</div>

</body>

</html>
