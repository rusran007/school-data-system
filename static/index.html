    //darkmode    
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial; display: flex; height: 100vh; overflow: hidden; }

.sidebar { width: 220px; border-right: 1px solid #eee; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-top { padding: 12px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 8px; }
.sidebar-top input { width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
.school-item { padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #555; display: flex; align-items: center; gap: 8px; user-select: none; }
.school-item:hover { background: #f5f5f5; color: #111; }
.school-item.active { background: #f0f0f0; color: #111; font-weight: bold; }

.main { flex: 1; overflow-y: auto; padding: 1.5rem; }
.school-header { margin-bottom: 1.25rem; }
.school-header h2 { font-size: 20px; font-weight: bold; color: #111; }
.school-header p { font-size: 12px; color: #888; margin-top: 4px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
.stat { background: #f7f7f7; border-radius: 8px; padding: 12px; }
.stat-label { font-size: 11px; color: #888; margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: bold; color: #111; }

.section { border: 1px solid #eee; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; background: #fff; }
.sec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.sec-title { font-size: 14px; font-weight: bold; color: #111; }
.sec-btn { font-size: 12px; padding: 4px 12px; border: 1px solid #ddd; border-radius: 6px; background: none; cursor: pointer; color: #555; }
.sec-btn:hover { background: #f5f5f5; }

.teacher-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #f0f0f0; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #dbeafe; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #2563eb; flex-shrink: 0; }
.t-name { flex: 1; font-size: 13px; color: #111; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #dcfce7; color: #16a34a; }
.course-badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #dbeafe; color: #2563eb; }

.img-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.img-thumb { aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 1px solid #eee; cursor: pointer; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.img-thumb img { width: 100%; height: 100%; object-fit: cover; }
.img-thumb:hover { border-color: #aaa; }

.doc-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #f0f0f0; cursor: pointer; }
.doc-row:hover .doc-name { color: #2563eb; }
.doc-icon { font-size: 16px; flex-shrink: 0; }
.doc-name { flex: 1; font-size: 13px; color: #111; }
.doc-open { font-size: 11px; color: #aaa; }

.empty { font-size: 13px; color: #aaa; padding: 8px 0; }
.no-school { display: flex; align-items: center; justify-content: center; height: 60%; font-size: 14px; color: #aaa; }

.preview-panel { position: fixed; top: 0; right: 0; width: 50%; height: 100%; background: #111; display: none; padding: 10px; z-index: 100; }
.preview-panel img { max-width: 100%; max-height: 90%; margin-top: 10px; }

.modal-backdrop { 
    position: fixed; 
    inset: 0; 
    background: rgba(0,0,0,0.4); /* ปรับให้เข้มขึ้นนิดหน่อยจะดูสวยขึ้น */
    display: none; /* เริ่มต้นซ่อนไว้ */
    align-items: center; 
    justify-content: center; 
    z-index: 200; 
    backdrop-filter: blur(2px); /* เพิ่มเอฟเฟกต์เบลอหลัง modal */
}
/* คลาสนี้จะถูกใช้เมื่อสั่งผ่าน JavaScript */
.modal-backdrop.open { 
    display: flex !important; 
}
.modal { 
    background: #fff; 
    border-radius: 20px; /* ปรับให้มนตามดีไซน์ใหม่ */
    border: none; 
    padding: 0; /* เอา padding ออกเพื่อให้ header/footer ชิดขอบ */
    width: 600px; 
    max-width: 95vw; 
    max-height: 85vh; 
    display: flex;
    flex-direction: column; /* จัดเรียงแบบบนลงล่าง */
    overflow: hidden; /* ห้าม scroll ที่ตัวนี้ */
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
.modal-body { 
    padding: 24px; 
    overflow-y: auto; /* เลื่อนเฉพาะตรงนี้ */
    flex: 1; /* กินพื้นที่ที่เหลือทั้งหมด */
}
.modal-title { font-size: 15px; font-weight: bold; color: #111; }
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #aaa; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 11px; color: #888; }
.form-group input, .form-group select { padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: #fff; color: #111; font-family: Arial; }
.form-actions { 
    display: flex; 
    justify-content: flex-end; 
    gap: 8px; 
    padding: 18px 24px; 
    background: #f8fafc; 
    border-top: 1px solid #f1f5f9; 
    margin-top: 0; /* เอา margin เดิมออก */
}
.btn-cancel { font-size: 13px; padding: 7px 16px; border: 1px solid #ddd; border-radius: 6px; background: none; cursor: pointer; color: #555; }
.btn-save { font-size: 13px; padding: 7px 16px; border: 1px solid #ddd; border-radius: 6px; background: none; cursor: pointer; color: #111; font-weight: bold; }
.btn-save:hover { background: #f5f5f5; }

/* school block ใน form */
.school-block { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.school-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.school-block-title { font-size: 13px; font-weight: bold; color: #111; }
.btn-remove-school { background: none; border: 1px solid #fca5a5; border-radius: 6px; padding: 3px 8px; cursor: pointer; color: #ef4444; font-size: 12px; }
.school-fee-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.teacher-form-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid #f5f5f5; }
.teacher-form-row input { padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }
.btn-remove { background: none; border: 1px solid #fca5a5; border-radius: 6px; padding: 4px 7px; cursor: pointer; color: #ef4444; font-size: 11px; }
.btn-add-teacher { font-size: 12px; padding: 5px 12px; border: 1px dashed #ddd; border-radius: 6px; background: none; cursor: pointer; color: #555; width: 100%; margin-top: 6px; }
.btn-add-teacher:hover { background: #f5f5f5; }
.btn-add-school { font-size: 13px; padding: 7px; border: 1px dashed #ddd; border-radius: 8px; background: none; cursor: pointer; color: #555; width: 100%; margin-top: 4px; }
.btn-add-school:hover { background: #f5f5f5; }

/* ticket card */
.ticket-card { border: 1px solid #eee; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 10px; }
.ticket-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.ticket-title { font-size: 14px; font-weight: bold; color: #111; }
.ticket-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.ticket-meta span { font-size: 12px; color: #666; }
.status-pending { font-size: 11px; padding: 3px 10px; border-radius: 6px; background: #fef9c3; color: #ca8a04; flex-shrink: 0; }
.status-done { font-size: 11px; padding: 3px 10px; border-radius: 6px; background: #dcfce7; color: #16a34a; flex-shrink: 0; }
.ticket-school-block { border: 1px solid #f0f0f0; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.ticket-school-name { font-size: 13px; font-weight: bold; color: #111; margin-bottom: 6px; }
.money-row { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.money-box { border-radius: 6px; padding: 6px 12px; text-align: center; }
.money-label { font-size: 10px; margin-bottom: 2px; }
.money-value { font-size: 14px; font-weight: bold; }
.ticket-teacher-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; transition: background 0.2s ease; }
.ticket-actions { display: flex; gap: 8px; padding-top: 8px; border-top: 1px solid #f0f0f0; margin-top: 4px; }

.btn-done:hover { background: #dcfce7; }

.ticket-fab {

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; display: none; z-index: 999; white-space: nowrap; }

<script>
let currentSchool = null;
let allSchools = [];
let schoolBlocks = [];
let editingTicketId = null;

// ── SCHOOLS ──────────────────────────────

async function loadSchools() {
    let res = await fetch("/api/schools");
    allSchools = await res.json();
    renderSchoolList(allSchools);
}

function renderSchoolList(schools) {
    let list = document.getElementById("schoolList");
    if (schools.length === 0) { list.innerHTML = '<div class="empty">ไม่พบโรงเรียน</div>'; return; }
    list.innerHTML = schools.map(s => `
        <div class="school-item" onclick="selectSchool(this, '${s}')">🏫 ${s}</div>
    `).join("");
}

async function selectSchool(el, name) {
    document.querySelectorAll(".school-item").forEach(i => i.classList.remove("active"));
    el.classList.add("active");
    currentSchool = name;
    document.getElementById("main").innerHTML = '<div class="no-school">กำลังโหลด...</div>';

    let [teachers, files, schoolTickets] = await Promise.all([
        fetch(`/api/teachers?school=${encodeURIComponent(name)}`).then(r => r.json()),
        fetch(`/api/school-files?school=${encodeURIComponent(name)}`).then(r => r.json()),
        fetch(`/api/school-tickets?school=${encodeURIComponent(name)}`).then(r => r.json()),
    ]);
    renderSchool(name, teachers, files, schoolTickets);
}

function scrollImages(direction) {
    const track = document.getElementById('imageTrack');
    const scrollAmount = 300; 
    track.scrollBy({ left: direction === 'left' ? -scrollAmount : scrollAmount, behavior: 'smooth' });
}



async function loadSchoolTicketMoney(ticketId, school, ticketFee) {
    let el = document.getElementById("schoolTicketMoney_" + ticketId);
    if (!el) return;

    try {
        let schools = await fetch("/api/ticket-schools?ticket_id=" + ticketId).then(r => r.json());
        let s = schools.find(item => item.school === school);
        
        if (!s) { 
            el.innerHTML = ""; 
            return; 
        }

        let expense = parseFloat(s.expense) || 0;
        
        // 1. อัปเดตยอดใช้จริงสะสมที่ Stat ด้านบน
        window.schoolAccumulatedExpense += expense;
        const totalDisplay = document.getElementById("totalSchoolExpense");
        if (totalDisplay) {
            totalDisplay.innerText = window.schoolAccumulatedExpense.toLocaleString() + " ฿";
        }

        // 2. คำนวณคงเหลือของใบเบิกนี้ (ยอดเบิก - ยอดใช้ของทุกโรงเรียนใน Ticket นี้)
        let totalExpenseOfTicket = schools.reduce((sum, item) => sum + (parseFloat(item.expense) || 0), 0);
        let balance = (parseFloat(ticketFee) || 0) - totalExpenseOfTicket;
        let balanceColor = balance >= 0 ? "#16a34a" : "#dc2626";

        el.innerHTML = `
            <div class="money-box" style="background:#fef9c3; padding:4px 8px; border-radius:6px; text-align:center; min-width:80px;">
                <div style="font-size:9px; color:#a16207;">เบิก</div>
                <div style="font-size:12px; font-weight:bold; color:#ca8a04;">${Number(ticketFee || 0).toLocaleString()}</div>
            </div>
            <div class="money-box" style="background:#f0fdf4; padding:4px 8px; border-radius:6px; text-align:center; min-width:80px;">
                <div style="font-size:9px; color:#15803d;">ใช้จริง</div>
                <div style="font-size:12px; font-weight:bold; color:#16a34a;">${expense.toLocaleString()}</div>
            </div>
            <div class="money-box" style="background:#f5f5f5; padding:4px 8px; border-radius:6px; text-align:center; min-width:80px;">
                <div style="font-size:9px; color:#888;">คงเหลือ</div>
                <div style="font-size:12px; font-weight:bold; color:${balanceColor};">${balance.toLocaleString()}</div>
            </div>`;
    } catch (err) {
        el.innerHTML = '<div style="font-size:11px; color:red;">error</div>';
    }
}

function showTicketPage(el) {
    // 1. ไฮไลท์เมนูที่เลือก
    document.querySelectorAll(".school-item").forEach(i => i.classList.remove("active"));
    if (el) el.classList.add("active");
    
    currentSchool = null;

    loadTickets();
}

async function loadTickets() {
    document.getElementById("main").innerHTML = '<div class="no-school">กำลังโหลด...</div>';
    try {
        const [pending, done] = await Promise.all([
            fetch("/api/tickets").then(r => r.json()),
            fetch("/api/tickets/done").then(r => r.json())
        ]);
        renderTicketPage(pending, done);
    } catch (e) {
        console.error("LoadTickets Error:", e);
        document.getElementById("main").innerHTML = '<div style="color:red;padding:20px;">❌ โหลดข้อมูลไม่สำเร็จ</div>';
    }
}

async function renderTicketPage(pending, done) {
    // โหลดข้อมูล schools ที่มี teachers ติดมาด้วยเลย (Nested)
    let allTickets = [...pending, ...done];
    let schoolsData = await Promise.all(
        allTickets.map(t => fetch("/api/ticket-schools?ticket_id=" + t.id).then(r => r.json()))
    );
    
    let ticketSchoolsMap = {};
    allTickets.forEach((t, i) => ticketSchoolsMap[t.id] = schoolsData[i]);

    let totalTeacherCount = 0;
    let totalFee = 0;
    let totalExpense = 0;
    
    allTickets.forEach(t => {
        totalFee += t.fee || 0;  // fee อยู่ระดับ ticket
        let schools = ticketSchoolsMap[t.id] || [];
        schools.forEach(s => {
            totalExpense += s.expense || 0;
        });
    });

    // นับครูจาก schools ที่โหลดมาแล้ว (teachers nested อยู่แล้ว)
    allTickets.forEach(t => {
        (ticketSchoolsMap[t.id] || []).forEach(s => {
            totalTeacherCount += (s.teachers || []).length;
        });
    });

    // แสดงผล HTML (ส่งข้อมูลที่โหลดมาแล้วเข้าไปใน ticketCardHTML)
    let pendingHTML = pending.map(t => ticketCardHTML(t, false, ticketSchoolsMap[t.id])).join("");
    let doneHTML = done.map(t => ticketCardHTML(t, true, ticketSchoolsMap[t.id])).join("");

    document.getElementById("main").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
            <div>
                <div style="font-size:20px; font-weight:bold; color:#111;">ticket อบรม</div>
                <div style="font-size:12px; color:#888; margin-top:4px;">จัดการ ticket การอบรมครู</div>
            </div>
            <button class="ticket-fab" onclick="openModal()">+</button>
        </div>

        <div class="stats" style="margin-bottom:1.25rem;">
            <div class="stat"><div class="stat-label">ticket ทั้งหมด</div><div class="stat-value">${pending.length + done.length}</div></div>
            <div class="stat"><div class="stat-label">กำลังดำเนินการ</div><div class="stat-value" style="color:#ca8a04;">${pending.length}</div></div>
            <div class="stat"><div class="stat-label">เสร็จสิ้นแล้ว</div><div class="stat-value" style="color:#16a34a;">${done.length}</div></div>
        </div>

        <div class="stats" style="margin-bottom:1.25rem;">
            <div class="stat"><div class="stat-label">ครูทั้งหมด</div><div class="stat-value">${totalTeacherCount} คน</div></div>
            <div class="stat"><div class="stat-label">เงินที่เบิก</div><div class="stat-value" style="font-size:16px;">${totalFee.toLocaleString()} ฿</div></div>
            <div class="stat"><div class="stat-label">เงินที่ใช้จริง</div><div class="stat-value" style="font-size:16px;">${totalExpense.toLocaleString()} ฿</div></div>
        </div>

        <div class="section">
            <div class="sec-header"><div class="sec-title">🕐 กำลังดำเนินการ (${pending.length})</div></div>
            ${pendingHTML}
        </div>
        <div class="section">
            <div class="sec-header"><div class="sec-title">✅ เสร็จสิ้นแล้ว (${done.length})</div></div>
            ${doneHTML}
        </div>`;
}

async function doneTicket(id) {

    showToast("✓ เสร็จสิ้น ครูถูกเพิ่มเข้าโรงเรียนแล้ว");
    loadTickets();
}

async function deleteTicket(id) {
    if (!confirm("ลบ ticket นี้?")) return;
    await fetch(`/api/tickets/${id}`, { method: "DELETE" });
    loadTickets();
}

function openModal() {
    editingTicketId = null;
    document.getElementById("modalTitle").textContent = "เพิ่ม ticket อบรม";
    
    // เคลียร์รายการโรงเรียน
    schoolBlocks = [];

    // เคลียร์ค่า input (ใช้รายชื่อ ID ที่มีใน HTML ของคุณ)
    ["tCoord", "tStartDate", "tEndDate", "tAddr", "tTotalFee","tNote"].forEach(id => {

        if (el) el.value = (id === "tTotalFee") ? "" : ""; 
    });

    // เซ็ตวันที่ปัจจุบันเป็นค่าเริ่มต้น
    document.getElementById("tStartDate").value = new Date().toISOString().split('T')[0];

    addSchoolBlock(); // เพิ่มบล็อกโรงเรียนแรก
    
    // สั่งเปิด Modal

}

async function openEditModal(id) {
    editingTicketId = id;
    document.getElementById("modalTitle").textContent = "แก้ไข ticket";
    schoolBlocks = [];
    document.getElementById("schoolBlockList").innerHTML = "";

    try {
        // 1. ดึงข้อมูล Ticket หลัก
        let pendingRes = await fetch("/api/tickets").then(r => r.json());
        let doneRes = await fetch("/api/tickets/done").then(r => r.json());
        let t = pendingRes.find(t => t.id === id) || doneRes.find(t => t.id === id);
        
        if (!t) return;

        // 2. ดึงข้อมูลโรงเรียน (teachers nested มาด้วยแล้วจาก /api/ticket-schools)
        let schoolsRes = await fetch("/api/ticket-schools?ticket_id=" + id).then(r => r.json());

        // ใส่ข้อมูลลงในฟอร์ม
        document.getElementById("tCoord").value = t.coordinator || "";
        document.getElementById("tStartDate").value = t.start_date || "";
        document.getElementById("tEndDate").value = t.end_date || "";
        document.getElementById("tAddr").value = t.addr || "";
        document.getElementById("tNote").value = t.note || "";
        document.getElementById("tTotalFee").value = t.fee || 0;

        for (let s of schoolsRes) {
            addSchoolBlock(s.school, s.expense, s.teachers || []);
        }
        
        if (schoolsRes.length === 0) addSchoolBlock();

        document.getElementById("ticketModal").classList.add("open");
    } catch (err) {
        console.error("Error opening edit modal:", err);
    }
}

function closeModal() {
    document.getElementById("ticketModal").classList.remove("open");
}

function handleBackdrop(e) {
    if (e.target.id === "ticketModal") {
        closeModal();
    }
}

function addSchoolBlock(school = "", expense = 0, teachers = []) {

    let div = document.createElement("div");

    div.id = "sblock_" + blockId;
    div.style.border = "1px solid #eee";
    div.style.padding = "15px";

    div.innerHTML = `
        <div class="school-block-header" style="display:flex; gap:10px; align-items:center; margin-bottom:12px;">
            <div style="flex:1;">
                <div style="font-size:11px; color:#666; margin-bottom:4px;">เลือกโรงเรียน</div>

                    <option value="">-- เลือกโรงเรียน --</option>
                    ${allSchools.map(s => `<option value="${s}" ${s === school ? 'selected' : ''}>${s}</option>`).join("")}
                </select>
            </div>
            <div style="width:160px;">
                <div style="font-size:11px; color:#666; margin-bottom:4px;">เงินที่ใช้จริง (บาท)</div>
                <input type="number" id="sexpense_${blockId}" placeholder="0" value="${expense || ""}" style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;">
            </div>
            <button class="btn-remove-school" onclick="removeSchoolBlock(${blockId})" style="margin-top:18px; padding:5px 10px; background:#fee2e2; color:#dc2626; border:none; border-radius:4px; cursor:pointer;">✕</button>
        </div>
        
        <div style="font-size:11px; font-weight:bold; color:#444; margin-bottom:8px; display:flex; align-items:center; gap:5px;">
            <span style="background:#ddd; width:15px; height:1px;"></span> รายชื่อครูที่เข้าอบรม
        </div>
        
        <div id="teacherList_${blockId}" style="margin-left:10px; padding-left:10px; border-left:2px solid #ddd;"></div>
        
        <button type="button" class="btn-add-teacher" onclick="addTeacherToBlock(${blockId})" style="margin: 10px 0 5px 10px; font-size:12px; color:#2563eb; background:none; border:none; cursor:pointer; font-weight:bold;">

    if (teachers && teachers.length > 0) {
        teachers.forEach(t => addTeacherToBlock(blockId, t.name, t.level, t.course));
    } else {
        addTeacherToBlock(blockId);
    }
}

function removeSchoolBlock(blockId) {
    let el = document.getElementById("sblock_" + blockId);
    if (el) el.remove();
    schoolBlocks = schoolBlocks.filter(b => b.blockId !== blockId);
}

function addTeacherToBlock(blockId, name="", level="", course="") {
    let block = schoolBlocks.find(b => b.blockId === blockId);
    if (!block) return;
    
    let rowId = Date.now() + Math.random();
    block.teacherRows.push(rowId);

    let div = document.createElement("div");
    div.className = "teacher-form-row";
    div.id = "trow_" + rowId;
    div.innerHTML = `
        <div class="avatar" id="avatar_${rowId}" style="width:28px;height:28px;font-size:10px;">??</div>
        <input type="text" id="tname_${rowId}" placeholder="ชื่อ-นามสกุล" value="${name}" 
               oninput="updateAvatar('${rowId}', this.value)">
        <input type="text" id="tlevel_${rowId}" placeholder="ระดับ" value="${level}">
        <input type="text" id="tcourse_${rowId}" placeholder="หลักสูตร" value="${course}">
        <button class="btn-remove" onclick="removeTeacherFromBlock(${blockId}, ${rowId})">✕</button>
    `;
    document.getElementById("teacherList_" + blockId).appendChild(div);
}

function removeTeacherFromBlock(blockId, rowId) {
    const el = document.getElementById("trow_" + rowId);
    if (el) el.remove();

    let block = schoolBlocks.find(b => b.blockId === blockId);
    if (block) {
        block.teacherRows = block.teacherRows.filter(id => id !== rowId);
    }
}

async function submitTicket() {
    const schools = schoolBlocks.map(block => {
        const schoolName = document.getElementById(`sname_${block.blockId}`)?.value || "";
        const expense = parseFloat(document.getElementById(`sexpense_${block.blockId}`)?.value) || null;
        
       // ใน submitTicket() ส่วนที่วนลูปครู
    const teachers = block.teacherRows.map(rId => {
    // ดึง id เดิมที่ซ่อนไว้ใน Input (ถ้ามี)
    const teacherId = document.getElementById(`tid_${rId}`)?.value || null; 
    return {
        id: teacherId ? parseInt(teacherId) : null, // ส่ง ID เดิมไปเพื่อให้ Rust รู้ว่าคนเดิม
        ticket_id: editingTicketId || null,
        school: schoolName,
        name: document.getElementById(`tname_${rId}`)?.value.trim() || "",
        level: document.getElementById(`tlevel_${rId}`)?.value.trim() || "",
        course: document.getElementById(`tcourse_${rId}`)?.value.trim() || "",
    };
}).filter(t => t.name !== "");

        return { 
            id: null, 
            ticket_id: editingTicketId || null, 
            school: schoolName, 
            expense, 
            teachers 
        };
    }).filter(s => s.school !== "");

    if (schools.length === 0) { 
        showToast("กรุณาเพิ่มโรงเรียนอย่างน้อย 1 โรงเรียน"); 
        return; 
    }

    const ticketData = {
        id: editingTicketId || null,
        ticket_no: document.getElementById("tNo")?.value.trim() || "", // ดึงเลข SMBQ-1 มาใส่ตรงนี้
        coordinator: document.getElementById("tCoord").value.trim(),
        // จุดที่แก้: เปลี่ยนจาก date เป็น start_date และ end_date ให้ตรงกับ HTML/Rust
        start_date: document.getElementById("tStartDate").value, 
        end_date: document.getElementById("tEndDate").value,
        addr: document.getElementById("tAddr").value.trim(),
        note: document.getElementById("tNote").value.trim(),
        fee: parseFloat(document.getElementById("tTotalFee").value) || null,
        done: null,
        schools
    };

    // ถ้ามี editingTicketId ให้ใช้ PUT เพื่อส่งไปแก้ไข แทน POST
    const url = editingTicketId ? `/api/tickets/${editingTicketId}` : "/api/tickets";
    const method = editingTicketId ? "PUT" : "POST";

    try {
        const res = await fetch(url, {
            method: method, // ใช้ method ที่เราแยกไว้
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(ticketData)
        });

        if (res.ok) {
            showToast(editingTicketId ? "แก้ไข ticket เรียบร้อย" : "เพิ่ม ticket เรียบร้อย");
            closeModal();
            loadTickets();
        } else {
            const err = await res.text();
            alert("เกิดข้อผิดพลาด: " + err);
        }
    } catch (e) { 
        console.error(e); 
        alert("ไม่สามารถติดต่อเซิร์ฟเวอร์ได้");
    }
}

function getIcon(name) {
    let ext = name.split(".").pop().toLowerCase();
    const icons = { pdf:"📕", doc:"📘", docx:"📘", xls:"📗", xlsx:"📗", ppt:"📙", pptx:"📙", txt:"📝", zip:"🗜️", rar:"🗜️" };
    return icons[ext] || "📄";
}

function getInitials(name) {
    let parts = name.trim().split(" ");
    if (parts.length >= 2) return (parts[0].slice(-1) + parts[1][0]).toUpperCase();
    return name.substring(0, 2);
}

    searchTimeout = setTimeout(async () => {
        let res = await fetch("/api/search?q=" + encodeURIComponent(q));

function showSearchResults(data) {
    let list = document.getElementById("schoolList");
    let schoolMatches = new Set();
    data.forEach(item => {
        let match = item.path.match(/School_([^/]+)/);
        if (match) schoolMatches.add(match[1]);
    });
    if (schoolMatches.size > 0) {
        list.innerHTML = [...schoolMatches].map(s => `
            <div class="school-item" onclick="selectSchool(this, '${s}')">🏫 ${s}</div>`).join("");
    } else {
        list.innerHTML = data.length === 0
            ? '<div class="empty">ไม่พบไฟล์</div>'
            : data.map(item => `
                <div class="school-item" onclick="openFile('${item.path}')">
                    ${item.is_dir ? "📁" : getIcon(item.name)} ${item.name}
                </div>`).join("");
    }
}

async function exportSchoolExcel(name) {
    showToast("กำลัง export...");

    // ดึงข้อมูลพร้อมกัน
    let [teachers, schoolTickets] = await Promise.all([
        fetch(`/api/teachers?school=${encodeURIComponent(name)}`).then(r => r.json()),
        fetch(`/api/school-tickets?school=${encodeURIComponent(name)}`).then(r => r.json()),
    ]);

    // ดึง schools data ของแต่ละ ticket เพื่อเอา expense
    let ticketSchoolsData = await Promise.all(
        schoolTickets.map(t => fetch("/api/ticket-schools?ticket_id=" + t.id).then(r => r.json()))
    );

    const wb = XLSX.utils.book_new();

    // ── Sheet 1: สรุปยอดเงิน ──────────────────
    let moneyRows = [["Ticket ID", "ผู้ประสานงาน", "วันที่", "สถานที่", "ยอดเบิก (฿)", "ยอดใช้จริง (฿)", "คงเหลือ (฿)"]];

    schoolTickets.forEach((t, i) => {
        let schools = ticketSchoolsData[i] || [];
        let schoolExpense = schools.find(s => s.school === name);
        let totalExpense = schools.reduce((sum, s) => sum + (s.expense || 0), 0);
        let expense = schoolExpense ? (schoolExpense.expense || 0) : 0;
        let balance = (t.fee || 0) - totalExpense;
        moneyRows.push([
            t.ticket_no || "",
            t.coordinator || "",
            t.start_date || "",
            t.addr || "",
            t.fee || 0,
            expense,
            balance,
        ]);
    });

    // แถวสรุป
    let totalFee = schoolTickets.reduce((s, t) => s + (t.fee || 0), 0);
    let totalExp = moneyRows.slice(1).reduce((s, r) => s + (r[5] || 0), 0);
    moneyRows.push(["", "", "", "รวม", totalFee, totalExp, totalFee - totalExp]);

    const ws1 = XLSX.utils.aoa_to_sheet(moneyRows);
    ws1["!cols"] = [14, 18, 12, 20, 14, 14, 14].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws1, "สรุปยอดเงิน");

    // ── Sheet 2: รายชื่อครู ──────────────────
    let teacherRows = [["ชื่อ-นามสกุล", "ระดับ", "หลักสูตรล่าสุด", "Ticket ล่าสุด"]];

    // ดึงประวัติครูแต่ละคน
    let historyData = await Promise.all(
        teachers.map(t =>
            fetch(`/api/teacher-history?name=${encodeURIComponent(t.name)}&school=${encodeURIComponent(name)}`)
                .then(r => r.json())
        )
    );

    teachers.forEach((t, i) => {
        let history = historyData[i]?.history || [];
        let latestTicket = history.length > 0 ? history[0].ticket_no : (t.ticket_id ? "" : "-");
        let allCourses = history.map(h => `${h.ticket_no}: ${h.course}`).join(" | ");
        teacherRows.push([
            t.name,
            t.level || "",
            t.course || "",
            latestTicket,
        ]);
    });

    const ws2 = XLSX.utils.aoa_to_sheet(teacherRows);
    ws2["!cols"] = [22, 16, 24, 14].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws2, "รายชื่อครู");

    // download
    XLSX.writeFile(wb, `โรงเรียน${name}_${new Date().toLocaleDateString('th-TH').replace(/\//g,'-')}.xlsx`);
    showToast("✅ Export สำเร็จ");
}

// ── DARK MODE ──────────────────────────
function toggleDark() {
    document.body.classList.toggle("dark");
    let isDark = document.body.classList.contains("dark");
    document.getElementById("darkBtn").textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("darkMode", isDark);
}

// โหลด dark mode preference
if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
    document.getElementById("darkBtn").textContent = "☀️";
}

// ── TEACHER SEARCH ──────────────────────
function showTeacherSearch(el) {
    document.querySelectorAll(".school-item").forEach(i => i.classList.remove("active"));
    el.classList.add("active");
    currentSchool = null;

    document.getElementById("main").innerHTML = `
        <div style="margin-bottom:1.25rem;">
            <div style="font-size:20px; font-weight:bold; color:#111; margin-bottom:4px;">🔍 ค้นหาครู</div>
            <div style="font-size:12px; color:#888;">ค้นหาชื่อครูข้ามทุกโรงเรียน</div>
        </div>
        <input id="teacherSearchInput" placeholder="พิมชื่อครู..." 
               style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:1rem;"
               oninput="searchTeacher(this.value)">
        <div id="teacherSearchResults"><div class="empty" style="text-align:center;padding:2rem;">พิมชื่อครูเพื่อค้นหา</div></div>
    `;

    setTimeout(() => document.getElementById("teacherSearchInput")?.focus(), 100);
}

let teacherSearchTimeout;
function searchTeacher(q) {
    clearTimeout(teacherSearchTimeout);
    if (q.length === 0) {
        document.getElementById("teacherSearchResults").innerHTML = 
            '<div class="empty" style="text-align:center;padding:2rem;">พิมชื่อครูเพื่อค้นหา</div>';
        return;
    }
    teacherSearchTimeout = setTimeout(async () => {
        let data = await fetch(`/api/search-teacher?q=${encodeURIComponent(q)}`).then(r => r.json());
        let el = document.getElementById("teacherSearchResults");
        if (!el) return;

        if (data.length === 0) {
            el.innerHTML = '<div class="empty" style="text-align:center;padding:2rem;">ไม่พบครูที่ค้นหา</div>';
            return;
        }

        el.innerHTML = `
            <div style="font-size:12px; color:#888; margin-bottom:8px;">พบ ${data.length} รายการ</div>
            ${data.map(t => `
                <div class="section" style="display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer; margin-bottom:8px;"
                     onclick="showTeacherHistory('${t.name.replace(/'/g,"\\'")}', '${(t.school||'').replace(/'/g,"\\'")}')">
                    <div class="avatar">${getInitials(t.name)}</div>
                    <div style="flex:1;">
                        <div style="font-size:14px; font-weight:bold; color:#111;">${t.name}</div>
                        <div style="font-size:12px; color:#888; margin-top:2px;">🏫 ${t.school || "-"}</div>
                    </div>
                    ${t.level ? `<div class="badge">${t.level}</div>` : ""}
                    ${t.course ? `<div class="course-badge" style="max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${t.course}</div>` : ""}
                    <span style="font-size:11px; color:#aaa;">📋 ประวัติ</span>
                </div>
            `).join("")}`;
    }, 300);
}

loadSchools();
</script>
